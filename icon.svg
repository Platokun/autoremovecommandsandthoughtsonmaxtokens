<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Auto-Trim Thoughts and Commands">
  <title>Auto-Trim Thoughts &amp; Commands</title>
  <rect width="64" height="64" rx="14" fill="#1f2430"/>
  <!-- thought bubble -->
  <path d="M12 16h34a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6H30l-9 9v-9h-3a6 6 0 0 1-6-6V22a6 6 0 0 1 6-6z"
        fill="none" stroke="#8ab4f8" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- three thought dots -->
  <circle cx="22" cy="29" r="2.6" fill="#8ab4f8"/>
  <circle cx="31" cy="29" r="2.6" fill="#8ab4f8"/>
  <circle cx="40" cy="29" r="2.6" fill="#8ab4f8"/>
  <!-- the trim: a slash through the bubble, tail kept -->
  <path d="M46 12 20 50" stroke="#f28b82" stroke-width="4.5" stroke-linecap="round"/>
</svg>
