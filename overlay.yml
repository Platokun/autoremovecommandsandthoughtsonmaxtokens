# One-off overlay: loads the plugin, no install required. The agent's own
# rewrite_memory/rwm_access/$rwm-<n>-full tools are live immediately;
# enabledByDefault:false leaves the automatic passes to /rwm enable.
#
#   dsh --profile web --patch "/500gb/dsh plugins/autoremovecommandsandthoughtsonmaxtokens/overlay.yml"
#
# Relative plugin names resolve beside this file; the absolute path is quoted
# because the directory name contains spaces.
- insert:
    - id: dsh-autotrim-context
      name: '/500gb/dsh plugins/autoremovecommandsandthoughtsonmaxtokens/index.js'
      config:
        enabledByDefault: false
        retainRecentMessages: 8
        autoStubToolResults: true
        autorunAfterThoughts: true
        autorunAfterConsole: true
        condenseSummaryTokens: 8
